<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnvBridge 迁移测试环境</title><style>body{font:15px "Segoe UI","Microsoft YaHei",sans-serif;background:#f7f8f3;color:#253c33;margin:40px auto;max-width:760px;padding:24px}button{font:inherit;background:#216750;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;margin:8px 8px 8px 0}pre{background:#fff;padding:20px;border:1px solid #e3e7de;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.8}</style><script src="/demo.js" defer></script></head><body><h1>EnvBridge 测试环境</h1><p id="origin"></p><p>仅生成测试数据，用于验证 Cookie、两类 Storage 和 IndexedDB 的跨 Origin 迁移。</p><button id="seed">初始化当前环境</button><button id="inspect">查看存储概况</button><button id="hold">占用数据库连接</button><button id="release">释放数据库连接</button><pre id="output">等待初始化。</pre></body></html>
